[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wireguard-access-orchestrator"
version = "0.1.0"
description = "WireGuard and nftables access-control automation lab"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
wgao = "wgao.__main__:main"
wgao-live-sync = "wgao.live_sync:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
